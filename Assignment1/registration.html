<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>

<body>

<center>

<h1>Register to Access !!</h1>

<h2>User Registration</h2>

<form action="course.html" target="content">

<table>

<tr>
    <td>Name:</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Roll Number:</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Department:</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Semester:</td>
    <td>
        <select>
            <option>1st</option>
            <option>2nd</option>
            <option>3rd</option>
            <option>4th</option>
            <option>5th</option>
            <option>6th</option>
            <option>7th</option>
            <option>8th</option>
        </select>
    </td>
</tr>

<tr>
    <td>Email:</td>
    <td><input type="email"></td>
</tr>

<tr>
    <td>Mobile:</td>
    <td><input type="tel"></td>
</tr>

<tr>
    <td>Photograph:</td>
    <td><input type="file"></td>
</tr>

<tr>
    <td colspan="2" align="center">
        <br>
        <input type="submit" value="Enter Question Bank">
    </td>
</tr>

</table>

</form>

</center>

</body>
</html>
